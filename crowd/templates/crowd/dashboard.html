{% extends "crowd/base.html" %}

{% block title %}Dashboard - FAGNI Crowd{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1><i class="bi bi-speedometer2"></i> Missions Disponibles</h1>
    <button class="btn btn-outline-primary" onclick="loadOffers()">
        <i class="bi bi-arrow-clockwise"></i> Actualiser
    </button>
</div>

<div class="row">
    <div class="col-12">
        <div id="offers-container">
            <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Chargement...</span>
                </div>
                <p class="mt-3 text-muted">Chargement des offres...</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
    const COTRANSPORTER_ID = {{ cotransporter_id }};
    
    // Charger les offres au démarrage
    document.addEventListener('DOMContentLoaded', loadOffers);
</script>
{% endblock %}
