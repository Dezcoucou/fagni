<style>
    :root {
        --fagni-orange: #ff7a00;
        --fagni-blue: #0056b3;
        --bg-soft: #f5f5f7;
        --card-bg: #ffffff;
        --border-soft: #e5e7eb;
        --text-main: #111827;
        --text-muted: #6b7280;
    }
    .page {
        max-width: 1100px;
        margin: 0 auto 32px;
        padding: 12px 10px 24px;
    }
    .page-header {
        display:flex;
        justify-content:space-between;
        align-items:flex-start;
        gap:12px;
        margin-bottom:18px;
    }
    .page-title {
        font-size:20px;
        font-weight:700;
        color:#0f172a;
        margin:0;
    }
    .page-subtitle {
        font-size:13px;
        color:#64748b;
        margin:4px 0 0;
    }
    .page-header__right {
        display:flex;
        flex-wrap:wrap;
        gap:8px;
        justify-content:flex-end;
    }
    .card {
        background:#ffffff;
        border-radius:16px;
        padding:16px 16px;
        margin-bottom:14px;
        border:1px solid #e5e7eb;
        box-shadow:0 2px 6px rgba(15,23,42,0.06);
    }
    .card-title {
        font-size:15px;
        font-weight:600;
        margin:0 0 10px;
        color:#0f172a;
        display:flex;
        align-items:center;
        gap:6px;
    }
    .card-title .emoji {
        font-size:18px;
    }
    label {
        font-size:13px;
        font-weight:500;
        color:#374151;
        display:block;
        margin-bottom:4px;
    }
    input, select, textarea {
        width:100%;
        padding:7px 9px;
        font-size:13px;
        border-radius:10px;
        border:1px solid #d1d5db;
        margin-bottom:8px;
        box-sizing:border-box;
    }
    input:focus, select:focus, textarea:focus {
        outline:none;
        border-color:#0f172a;
        box-shadow:0 0 0 1px rgba(15,23,42,0.1);
    }
    textarea {
        min-height:70px;
        resize:vertical;
    }
    .btn {
        display:inline-flex;
        align-items:center;
        justify-content:center;
        padding:8px 14px;
        border-radius:999px;
        font-size:13px;
        border:1px solid transparent;
        cursor:pointer;
        text-decoration:none;
        white-space:nowrap;
    }
    .btn-primary {
        background:#0f172a;
        border-color:#0f172a;
        color:#fff;
    }
    .btn-primary:hover {
        opacity:0.95;
    }
    .btn-light {
        background:#fff;
        border-color:#e5e7eb;
        color:#374151;
    }
    .btn-light:hover {
        background:#f9fafb;
    }
    .btn-small {
        border-radius:999px;
        border:1px solid var(--fagni-orange);
        background:#fff;
        color:var(--fagni-orange);
        padding:6px 10px;
        font-size:12px;
        cursor:pointer;
        white-space:nowrap;
        display:inline-flex;
        align-items:center;
        gap:4px;
    }
    .btn-small:hover {
        background:#fff5eb;
    }
    .btn-icon {
        padding:4px 7px;
        border-radius:999px;
        border:1px solid #e5e7eb;
        background:#fff;
        font-size:11px;
        cursor:pointer;
    }
    .btn-icon:hover {
        background:#fee2e2;
        border-color:#fecaca;
    }
    .form-grid {
        display:grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap:10px 14px;
    }
    .two-cols {
        display:grid;
        grid-template-columns:1.1fr 0.9fr;
        gap:14px;
    }
    .address-row {
        display:flex;
        gap:8px;
        align-items:center;
    }
    .address-row input {
        margin-bottom:0;
    }
    .small-help {
        font-size:11px;
        color:var(--text-muted);
        margin-top:2px;
        margin-bottom:6px;
        display:block;
    }
    .client-status {
        font-size:11px;
        margin-top:0;
        display:block;
    }
    .client-status--found { color:#15803d; }
    .client-status--new { color:#6b7280; }
    /* Map */
    #map {
        width:100%;
        height:240px;
        border-radius:12px;
        border:1px solid #e5e7eb;
        margin-top:4px;
    }
    .map-note {
        font-size:11px;
        color:#6b7280;
        margin-top:4px;
    }
    /* Articles */
    .section-header {
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap:8px;
        margin-top:4px;
        margin-bottom:6px;
    }
    .badge-soft {
        padding:4px 8px;
        border-radius:999px;
        background:#eff6ff;
        color:#1d4ed8;
        font-size:11px;
        white-space:nowrap;
    }
    .articles-table-wrapper {
        width:100%;
        overflow-x:auto;
        border:1px solid #e5e7eb;
        border-radius:12px;
        margin-top:4px;
    }
    table {
        width:100%;
        border-collapse:collapse;
        font-size:13px;
        min-width:680px;
    }
    th, td {
        padding:7px 8px;
        border-bottom:1px solid #e5e7eb;
        text-align:left;
        vertical-align:top;
    }
    thead th {
        background:#f9fafb;
        font-weight:600;
        color:#6b7280;
        font-size:12px;
    }
    tbody tr:nth-child(even) { background:#fcfcfd; }
    tbody tr:hover { background:#f5f5ff; }
    td.num {
        text-align:right;
        white-space:nowrap;
    }
    .line-designation { font-weight:500; }
    .line-meta {
        font-size:10px;
        color:#6b7280;
        margin-top:2px;
    }
    .photos-preview {
        margin-top:4px;
        display:flex;
        gap:4px;
        flex-wrap:wrap;
    }
    .photos-preview img {
        width:36px;
        height:36px;
        object-fit:cover;
        border-radius:6px;
        border:1px solid #ddd;
    }
    .photo-info {
        font-size:11px;
        color:#555;
        margin-left:4px;
    }
    .readonly-input {
        background:#f8fafc;
        cursor:not-allowed;
        color:#4b5563;
    }
    .totals-box {
        margin-top:12px;
        padding:12px;
        border-radius:12px;
        background:#f9fafb;
        border:1px solid #e5e7eb;
        font-size:13px;
    }
    .totals-row {
        display:flex;
        justify-content:space-between;
        margin-bottom:4px;
    }
    .totals-row strong { color:#0f172a; }
    .totals-row.total-grand {
        margin-top:6px;
        font-size:15px;
    }
    .totals-row.total-grand strong:last-child {
        color:var(--fagni-orange);
    }
    .note {
        font-size:11px;
        color:#6b7280;
        margin-top:6px;
    }
    .note-strong {
        font-size:11px;
        color:#4338ca;
        margin-top:4px;
    }
    .actions {
        margin-top:20px;
        display:flex;
        gap:10px;
        justify-content:flex-end;
        flex-wrap:wrap;
    }
    .error {
        background:#fee2e2;
        border:1px solid #fecaca;
        color:#b91c1c;
        padding:8px 10px;
        border-radius:10px;
        font-size:13px;
        margin-bottom:10px;
    }
    /* Stepper simple */
    .steps {
        display:flex;
        gap:8px;
        margin-top:4px;
        margin-bottom:10px;
        flex-wrap:wrap;
    }
    .step {
        padding:4px 9px;
        border-radius:999px;
        border:1px solid #e5e7eb;
        font-size:11px;
        color:#6b7280;
        background:#f9fafb;
    }
    .step.active {
        border-color:var(--fagni-orange);
        background:#fff7ed;
        color:#9a3412;
        font-weight:600;
    }
    @media (max-width: 900px) {
        .two-cols { grid-template-columns:1fr; }
        table { min-width:0; }
    }
</style>
