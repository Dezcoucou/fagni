{% load static %}
<link rel="stylesheet" href="{% static 'vendor/leaflet/leaflet.css' %}">
<link rel="stylesheet" href="{% static 'vendor/leaflet-markercluster/MarkerCluster.css' %}">
<link rel="stylesheet" href="{% static 'vendor/leaflet-markercluster/MarkerCluster.Default.css' %}">
<style>
  #map-wrapper{
    position: relative;
    border: 1px solid #e5e7eb;
    border-radius: 16px;
    overflow: hidden;
    background: #fff;
  }
  #driver-map{
    height: 360px;
    width: 100%;
  }
  #leaflet-status-pill{
    position: absolute;
    top: 12px;
    right: 12px;
    display: none;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    border-radius: 999px;
    border: 1px solid #e5e7eb;
    background: rgba(255,255,255,.92);
    box-shadow: 0 10px 22px rgba(15, 23, 42, 0.12);
    font-size: 12px;
    color: #111827;
    z-index: 999;
    user-select: none;
  }
  #leaflet-status-pill .dot{
    width: 9px;
    height: 9px;
    border-radius: 99px;
    background: #22c55e;
    box-shadow: 0 0 0 4px rgba(34,197,94,.18);
  }
  #leaflet-status-pill.offline .dot{
    background: #ef4444;
    box-shadow: 0 0 0 4px rgba(239,68,68,.16);
  }
  .map-toolbar{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin: 8px 0 10px;
    flex-wrap: wrap;
  }
  .map-toolbar-left{
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    font-size: 12px;
    color: #374151;
  }
  .map-toolbar-right{
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .map-btn{
    border: 1px solid #e5e7eb;
    background: #fff;
    border-radius: 999px;
    padding: 7px 10px;
    cursor: pointer;
    font-size: 12px;
    color: #374151;
    box-shadow: 0 6px 16px rgba(15, 23, 42, 0.07);
  }
  .map-btn:hover{ background:#f3f4f6; }
  .map-toggle{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    border-radius: 999px;
    border: 1px solid #e5e7eb;
    background: #fff;
  }
  .map-toggle input{ transform: translateY(1px); }
  /* PIN custom */
  .fagni-pin{
    width: 12px;
    height: 12px;
    border-radius: 999px;
    border: 2px solid #fff;
    box-shadow: 0 6px 16px rgba(15, 23, 42, 0.25);
  }
  .fagni-pin.active{ background:#22c55e; }
  .fagni-pin.idle{ background:#f59e0b; }
  .fagni-pin.offline{ background:#9ca3af; }
  .marker-cluster-small,
  .marker-cluster-medium,
  .marker-cluster-large{
    border-radius: 999px !important;
  }
</style>
<div class="card">
  <h2 class="card-title">
    <span class="emoji">🗺️</span>
    Carte des livreurs actifs
  </h2>
  <div class="map-toolbar">
    <div class="map-toolbar-left">
      <label class="map-toggle">
        <input type="checkbox" id="toggle-active-only" checked>
        Afficher actifs seulement
      </label>
      <span>
        Actifs: <strong id="active-counter">0</strong>
      </span>
    </div>
    <div class="map-toolbar-right">
      <button type="button" class="map-btn" id="btn-map-recenter">🎯 Recentrer</button>
    </div>
  </div>
  <div id="map-wrapper">
    <div id="driver-map"></div>
    <div id="leaflet-status-pill">
      <span class="dot"></span>
      <span class="txt">Live</span>
    </div>
  </div>
  <p style="font-size:12px;color:#6b7280;margin-top:8px;">
    Position live des livreurs (mise à jour automatique).
  </p>
</div>
<script src="{% static 'vendor/leaflet/leaflet.js' %}"></script>
<script src="{% static 'vendor/leaflet-markercluster/leaflet.markercluster.js' %}"></script>
<script id="drivers-json" type="application/json">
{{ drivers_json|safe }}
</script>
<script>
(function(){
  "use strict";
  const MAP_EL = document.getElementById("driver-map");
  if (!MAP_EL) return;
  const STATUS_PILL = document.getElementById("leaflet-status-pill");
  const STATUS_TXT = STATUS_PILL ? STATUS_PILL.querySelector(".txt") : null;
  const TOGGLE_ACTIVE_ONLY = document.getElementById("toggle-active-only");
  const ACTIVE_COUNTER = document.getElementById("active-counter");
  const BTN_RECENTER = document.getElementById("btn-map-recenter");
  const LIVE_URL = "/orders/ops-dashboard/drivers-live/";
  const POLL_MS = 10000;
  const ACTIVE_MS = 10 * 60 * 1000; // 10 min
  const IDLE_MS   = 30 * 60 * 1000; // 30 min (après => offline)
  function parseISO(s){
    const t = Date.parse(s);
    return Number.isFinite(t) ? t : null;
  }
  function getServerNow(payload){
    const t = payload && payload.server_time ? parseISO(payload.server_time) : null;
    return t || Date.now();
  }
  function driverStatus(d, serverNowMs){
    const t = parseISO(d.updated_at);
    if (!t) return "offline";
    const age = serverNowMs - t;
    if (age <= ACTIVE_MS) return "active";
    if (age <= IDLE_MS) return "idle";
    return "offline";
  }
  function esc(s){
    return String(s || "").replace(/[&<>"']/g, m => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
    }[m]));
  }
  function fmtMoney(n){
    const v = Number(n || 0);
    try { return v.toLocaleString("fr-FR"); } catch(e){ return String(v); }
  }
  let initialPayload = { ok:true, count:0, drivers:[], server_time:null };
  try {
    initialPayload = JSON.parse(document.getElementById("drivers-json").textContent || "{}");
  } catch(e){}
  const fallbackCenter = [5.3599517, -4.0082563]; // Abidjan
  const initDrivers = (initialPayload && initialPayload.drivers) ? initialPayload.drivers : [];
  const startCenter = initDrivers.length ? [initDrivers[0].latitude, initDrivers[0].longitude] : fallbackCenter;
  const map = L.map("driver-map", { zoomControl: true }).setView(startCenter, 12);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap"
  }).addTo(map);
  const cluster = L.markerClusterGroup({
    chunkedLoading: true,
    showCoverageOnHover: false,
    maxClusterRadius: 50
  });
  map.addLayer(cluster);
  const markersById = new Map();
  let lastBounds = null;
  let lastPayload = initialPayload;
  function makeIcon(status){
    return L.divIcon({
      className: "",
      html: `<div class="fagni-pin ${status}"></div>`,
      iconSize: [12, 12],
      iconAnchor: [6, 6]
    });
  }
  function popupHTML(d, status, serverNowMs){
    const upd = d.updated_at ? new Date(parseISO(d.updated_at)).toLocaleString("fr-FR") : "—";
    const ageSec = d.updated_at ? Math.max(0, Math.round((serverNowMs - parseISO(d.updated_at)) / 1000)) : null;
    const badge = status === "active" ? "🟢 Actif" : (status === "idle" ? "🟠 Idle" : "⚪ Offline");
    const opsUrl = `/orders/ops-dashboard/?driver_id=${encodeURIComponent(d.id)}&focus=driver`;
    return `
      <div style="min-width:230px">
        <div style="font-weight:800;margin-bottom:6px;">${esc(d.name)}</div>
        <div style="font-size:12px;color:#374151;line-height:1.35;">
          ${badge}<br>
          📍 ${esc(d.city || "—")}<br>
          📦 ${esc(d.week_orders)} courses (semaine)<br>
          💰 ${fmtMoney(d.week_earnings)} FCFA (semaine)<br>
          🕒 Maj: ${esc(upd)}${ageSec !== null ? ` (${ageSec}s)` : ""}
        </div>
        <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">
          <a href="${opsUrl}" style="
            display:inline-flex;align-items:center;justify-content:center;
            padding:7px 10px;border-radius:999px;text-decoration:none;
            border:1px solid #e5e7eb;background:#fff;color:#374151;
            font-size:12px;box-shadow:0 6px 16px rgba(15,23,42,.07);
          ">📋 Voir commandes</a>
        </div>
      </div>
    `;
  }
  function setPillOnline(isOnline){
    if (!STATUS_PILL) return;
    STATUS_PILL.style.display = "flex";
    if (isOnline){
      STATUS_PILL.classList.remove("offline");
      if (STATUS_TXT) STATUS_TXT.textContent = "Live";
    } else {
      STATUS_PILL.classList.add("offline");
      if (STATUS_TXT) STATUS_TXT.textContent = "Offline";
    }
  }
  function gotoDriverFilter(driverId){
    try{
      const url = new URL(window.location.href);
      url.pathname = "/orders/ops-dashboard/";
      url.searchParams.set("focus", "driver");
      url.searchParams.set("driver_id", String(driverId));
      // Nettoyage: pagination/selection commande
      ["pending_page","progress_page","done_page","highlight"].forEach(k => url.searchParams.delete(k));
      window.location.href = url.toString();
    } catch(e){
      window.location.href = "/orders/ops-dashboard/?focus=driver&driver_id=" + encodeURIComponent(driverId);
    }
  }
  function rebuild(payload){
    lastPayload = payload || lastPayload;
    const serverNowMs = getServerNow(payload);
    const drivers = payload && payload.drivers ? payload.drivers : [];
    // compteur actifs
    let activeCount = 0;
    drivers.forEach(d => {
      const st = driverStatus(d, serverNowMs);
      if (st === "active" || st === "idle") activeCount++;
    });
    if (ACTIVE_COUNTER) ACTIVE_COUNTER.textContent = String(activeCount);
    // filtre
    const activeOnly = !!(TOGGLE_ACTIVE_ONLY && TOGGLE_ACTIVE_ONLY.checked);
    // bounds
    const bounds = L.latLngBounds([]);
    // upsert markers
    const keepIds = new Set();
    drivers.forEach(d => {
      if (typeof d.latitude !== "number" || typeof d.longitude !== "number") return;
      const st = driverStatus(d, serverNowMs);
      const isShown = !activeOnly || (st === "active" || st === "idle");
      keepIds.add(d.id);
      let marker = markersById.get(d.id);
      if (!marker){
        marker = L.marker([d.latitude, d.longitude], { icon: makeIcon(st) });
        marker.bindPopup(popupHTML(d, st, serverNowMs));
        // ✅ clic marker => filtre driver + focus + URL propre
        marker.on("click", function(){
          gotoDriverFilter(d.id);
        });
        markersById.set(d.id, marker);
        cluster.addLayer(marker);
      } else {
        marker.setLatLng([d.latitude, d.longitude]);
        marker.setIcon(makeIcon(st));
        marker.setPopupContent(popupHTML(d, st, serverNowMs));
      }
      // show/hide by adding/removing from cluster
      const isInCluster = cluster.hasLayer(marker);
      if (isShown && !isInCluster) cluster.addLayer(marker);
      if (!isShown && isInCluster) cluster.removeLayer(marker);
      if (isShown) bounds.extend([d.latitude, d.longitude]);
    });
    // remove stale markers
    for (const [id, marker] of markersById.entries()){
      if (!keepIds.has(id)){
        if (cluster.hasLayer(marker)) cluster.removeLayer(marker);
        markersById.delete(id);
      }
    }
    // fit bounds on first build (or if we have none)
    if (!lastBounds && bounds.isValid()){
      map.fitBounds(bounds, { padding: [30, 30] });
      lastBounds = bounds;
    }
  }
  async function poll(){
    try{
      const res = await fetch(LIVE_URL, { headers: { "Accept": "application/json" } });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const payload = await res.json();
      setPillOnline(true);
      rebuild(payload);
      // si on a une demande de focus en attente, on tente après refresh
      const pending = window.__OPS_FOCUS_DRIVER_ID__;
      if (pending) focusDriverById(Number(pending));
    } catch(e){
      setPillOnline(false);
    }
  }
  if (BTN_RECENTER){
    BTN_RECENTER.addEventListener("click", function(){
      const bounds = L.latLngBounds([]);
      let added = 0;
      for (const marker of markersById.values()){
        if (cluster.hasLayer(marker)){
          bounds.extend(marker.getLatLng());
          added++;
        }
      }
      if (added && bounds.isValid()){
        map.fitBounds(bounds, { padding: [30, 30] });
      }
    });
  }
  if (TOGGLE_ACTIVE_ONLY){
    TOGGLE_ACTIVE_ONLY.addEventListener("change", function(){
      rebuild(lastPayload);
      poll();
    });
  }
  function focusDriverById(id){
    const marker = markersById.get(id);
    // Si pas encore présent, on tente un rebuild depuis lastPayload + poll
    if (!marker){
      setTimeout(() => poll(), 0);
      return false;
    }
    // S'assurer que le marker est visible même si "active only" est ON
    if (!cluster.hasLayer(marker)) cluster.addLayer(marker);
    const ll = marker.getLatLng();
    map.setView(ll, Math.max(map.getZoom(), 15), { animate: true });
    setTimeout(() => {
      try { marker.openPopup(); } catch(e){}
    }, 250);
    return true;
  }
  window.__OPS_FOCUS_DRIVER__ = focusDriverById;
  window.addEventListener("ops:focus-driver", function(){
    const id = window.__OPS_FOCUS_DRIVER_ID__;
    if (!id) return;
    if (!focusDriverById(Number(id))){
      setTimeout(() => focusDriverById(Number(id)), 1200);
    }
  });
  // init
  setPillOnline(true);
  rebuild(initialPayload);
  // start polling
  poll();
  setInterval(poll, POLL_MS);
})();
</script>
