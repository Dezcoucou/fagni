<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-messaging-compat.js"></script>
<script>
(function(){
  const clientId = "{{ customer.id|default:'' }}";
  if (!clientId || !("Notification" in window) || !("serviceWorker" in navigator)) return;

  const firebaseConfig = {
    apiKey: "AIzaSyBOvQlxIZT2cB5bIvNTZOu-OsN7zzIWjV4",
    authDomain: "fagni-c2eb9.firebaseapp.com",
    projectId: "fagni-c2eb9",
    storageBucket: "fagni-c2eb9.firebasestorage.app",
    messagingSenderId: "1006320008190",
    appId: "1:1006320008190:web:dbf3503aba71b174e9deaf",
    measurementId: "G-EWGC5P6N6E"
  };

  const vapidKey = "BDsX0xkoUnXDmIQN0eY6u9dM5GJIBUFs7cNZU71BlimNX7b88HZbkSr4HaFaOwcXt865IBhTQXRABmha7uj-geQ";

  async function registerClientFCM(){
    try {
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

      const permission = await Notification.requestPermission();
      if (permission !== "granted") return;

      const registration = await navigator.serviceWorker.register("{% static 'firebase-messaging-sw.js' %}");
      const messaging = firebase.messaging();

      const token = await messaging.getToken({
        vapidKey: vapidKey,
        serviceWorkerRegistration: registration
      });

      if (!token) return;

      await fetch("/api/fcm/token/", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          token: token,
          user_type: "client",
          user_id: clientId
        })
      });

      console.log("[FAGNI FCM] Client token enregistré", clientId);
    } catch(e) {
      console.warn("[FAGNI FCM] Client token error", e);
    }
  }


  function injectFagniNotifButton(){
    if (document.getElementById("fagni-enable-notifs")) return;
    const btn = document.createElement("button");
    btn.id = "fagni-enable-notifs";
    btn.type = "button";
    btn.textContent = "🔔 Activer les notifications";
    btn.style.cssText = "position:fixed;left:14px;right:14px;bottom:86px;z-index:9999;padding:13px 16px;border:0;border-radius:18px;background:#C9A84C;color:#0A1628;font-weight:900;box-shadow:0 12px 30px rgba(0,0,0,.25);";
    btn.addEventListener("click", async function(){
      await registerClientFCM();
      btn.remove();
    });
    document.body.appendChild(btn);
  }

  if (Notification.permission === "granted") {
    registerClientFCM();
  } else if (Notification.permission === "default") {
    injectFagniNotifButton();
  }

})();
</script>

{% endblock %}
