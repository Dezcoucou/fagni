services:
  - type: web
    name: fagni
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py migrate --noinput"
    startCommand: "gunicorn fagni.wsgi"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: fagni.settings
      - key: PYTHON_VERSION
        value: 3.11
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: OPS_PASSWORD
        sync: false
      - key: SIMULATEUR_NOTIFY_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
